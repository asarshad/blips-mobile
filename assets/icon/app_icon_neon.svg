<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark cyberpunk background with rounded corners for iOS -->
  <rect width="1024" height="1024" rx="224" fill="#0A0A0F"/>
  
  <!-- Grid pattern overlay for cyberpunk feel -->
  <defs>
    <!-- Neon cyan gradient -->
    <linearGradient id="neonCyanGradient" x1="200" y1="200" x2="824" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#00B8B8"/>
    </linearGradient>
    
    <!-- Neon magenta gradient -->
    <linearGradient id="neonMagentaGradient" x1="200" y1="200" x2="824" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF00FF"/>
      <stop offset="100%" stop-color="#CC00CC"/>
    </linearGradient>
    
    <!-- Glow filter for neon effect -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Subtle grid lines for cyberpunk aesthetic -->
  <g opacity="0.1">
    <line x1="256" y1="0" x2="256" y2="1024" stroke="#00FFFF" stroke-width="1"/>
    <line x1="512" y1="0" x2="512" y2="1024" stroke="#00FFFF" stroke-width="1"/>
    <line x1="768" y1="0" x2="768" y2="1024" stroke="#00FFFF" stroke-width="1"/>
    <line x1="0" y1="256" x2="1024" y2="256" stroke="#00FFFF" stroke-width="1"/>
    <line x1="0" y1="512" x2="1024" y2="512" stroke="#00FFFF" stroke-width="1"/>
    <line x1="0" y1="768" x2="1024" y2="768" stroke="#00FFFF" stroke-width="1"/>
  </g>
  
  <!-- Top card - neon cyan with glow -->
  <g filter="url(#neonGlow)">
    <rect x="280" y="220" width="464" height="160" rx="24" fill="transparent" stroke="#00FFFF" stroke-width="3"/>
  </g>
  <rect x="280" y="220" width="464" height="160" rx="24" fill="#0A0A0F" stroke="#00FFFF" stroke-width="2"/>
  <rect x="320" y="260" width="200" height="16" rx="8" fill="#00FFFF" opacity="0.9"/>
  <rect x="320" y="292" width="140" height="12" rx="6" fill="#00FFFF" opacity="0.4"/>
  <rect x="320" y="316" width="180" height="12" rx="6" fill="#00FFFF" opacity="0.4"/>
  
  <!-- Middle card - neon magenta accent -->
  <g filter="url(#neonGlow)">
    <rect x="280" y="420" width="464" height="160" rx="24" fill="transparent" stroke="#FF00FF" stroke-width="3"/>
  </g>
  <rect x="280" y="420" width="464" height="160" rx="24" fill="#0A0A0F" stroke="#FF00FF" stroke-width="2"/>
  <rect x="320" y="460" width="180" height="16" rx="8" fill="#FF00FF" opacity="0.9"/>
  <rect x="320" y="492" width="160" height="12" rx="6" fill="#FF00FF" opacity="0.4"/>
  <rect x="320" y="516" width="200" height="12" rx="6" fill="#FF00FF" opacity="0.4"/>
  
  <!-- Bottom card - neon green -->
  <g filter="url(#neonGlow)">
    <rect x="280" y="620" width="464" height="160" rx="24" fill="transparent" stroke="#39FF14" stroke-width="3"/>
  </g>
  <rect x="280" y="620" width="464" height="160" rx="24" fill="#0A0A0F" stroke="#39FF14" stroke-width="2"/>
  <rect x="320" y="660" width="220" height="16" rx="8" fill="#39FF14" opacity="0.9"/>
  <rect x="320" y="692" width="120" height="12" rx="6" fill="#39FF14" opacity="0.4"/>
  <rect x="320" y="716" width="170" height="12" rx="6" fill="#39FF14" opacity="0.4"/>
  
  <!-- Notification dot / "blip" indicator with neon glow -->
  <g filter="url(#strongGlow)">
    <circle cx="700" cy="280" r="40" fill="#00FFFF"/>
  </g>
  <circle cx="700" cy="280" r="35" fill="#00FFFF"/>
  <circle cx="700" cy="280" r="20" fill="#0A0A0F"/>
  <circle cx="700" cy="280" r="12" fill="#00FFFF"/>
</svg>
