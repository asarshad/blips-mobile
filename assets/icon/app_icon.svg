<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="edgeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="36%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="64%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="52%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0E1527" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0E1527" flood-opacity="0.10"/>
    </filter>
    <filter id="logoEmboss" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-1.4" dy="-1.4" stdDeviation="1.7" flood-color="#FFFFFF" flood-opacity="0.56"/>
      <feDropShadow dx="0" dy="4.2" stdDeviation="4.8" flood-color="#0E1527" flood-opacity="0.12"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="24" y="24" width="976" height="976" rx="220"/>
    </clipPath>
    <clipPath id="barsClip">
      <rect x="-256" y="-50" width="44" height="100" rx="22"/>
      <rect x="-178" y="-118" width="44" height="236" rx="22"/>
      <rect x="-100" y="-186" width="44" height="372" rx="22"/>
      <rect x="-22" y="-170" width="44" height="340" rx="22"/>
      <rect x="56" y="-222" width="44" height="444" rx="22"/>
      <rect x="134" y="-132" width="44" height="264" rx="22"/>
      <rect x="212" y="-56" width="44" height="112" rx="22"/>
    </clipPath>
    <clipPath id="lowerWaveClip">
      <path d="M -380 2 C -342 -58 -286 -64 -228 -4 C -178 46 -126 48 -64 -2 C -4 -48 56 -52 114 -2 C 170 46 226 50 280 6 C 314 -16 330 -16 340 -8 L 360 280 L -360 280 Z"/>
