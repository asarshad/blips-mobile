        <path d="M -380 2 C -342 -58 -286 -64 -228 -4 C -178 46 -126 48 -64 -2 C -4 -48 56 -52 114 -2 C 170 46 226 50 280 6 C 314 -16 330 -16 340 -8" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round" opacity="0.11"/>
        <path d="M -380 2 C -342 -58 -286 -64 -228 -4 C -178 46 -126 48 -64 -2 C -4 -48 56 -52 114 -2 C 170 46 226 50 280 6 C 314 -16 330 -16 340 -8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.12"/>
      </g>
