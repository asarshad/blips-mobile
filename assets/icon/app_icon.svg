    <rect x="24" y="24" width="976" height="976" rx="220" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect x="29" y="29" width="966" height="966" rx="215" fill="none" stroke="url(#edgeLight)" stroke-width="10"/>
    <rect x="31" y="31" width="962" height="962" rx="213" fill="none" stroke="url(#edgeShade)" stroke-width="10"/>
  </g>

  <g filter="url(#logoEmboss)">
    <g transform="translate(512 390)">
      <rect x="-256" y="-50" width="44" height="100" rx="22" fill="#D65AC5"/>
      <rect x="-178" y="-118" width="44" height="236" rx="22" fill="#F06A5F"/>
      <rect x="-100" y="-186" width="44" height="372" rx="22" fill="#CFDB2C"/>
      <rect x="-22" y="-170" width="44" height="340" rx="22" fill="#6A8CF0"/>
      <rect x="56" y="-222" width="44" height="444" rx="22" fill="#F2A32C"/>
      <rect x="134" y="-132" width="44" height="264" rx="22" fill="#E8A12A"/>
      <rect x="212" y="-56" width="44" height="112" rx="22" fill="#E95A79"/>

