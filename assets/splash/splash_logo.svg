<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="blipGradient" x1="50" y1="50" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  
  <!-- Stylized cards representing news feed -->
  <!-- Top card -->
  <rect x="80" y="60" width="240" height="80" rx="16" fill="url(#blipGradient)"/>
  <rect x="100" y="85" width="100" height="10" rx="5" fill="white" opacity="0.9"/>
  <rect x="100" y="105" width="70" height="8" rx="4" fill="white" opacity="0.5"/>
  
  <!-- Middle card -->
  <rect x="80" y="160" width="240" height="80" rx="16" fill="url(#blipGradient)"/>
  <rect x="100" y="185" width="120" height="10" rx="5" fill="white" opacity="0.9"/>
  <rect x="100" y="205" width="80" height="8" rx="4" fill="white" opacity="0.5"/>
  
  <!-- Bottom card -->
  <rect x="80" y="260" width="240" height="80" rx="16" fill="url(#blipGradient)"/>
  <rect x="100" y="285" width="90" height="10" rx="5" fill="white" opacity="0.9"/>
  <rect x="100" y="305" width="60" height="8" rx="4" fill="white" opacity="0.5"/>
  
  <!-- Notification dot -->
  <circle cx="290" cy="100" r="20" fill="#F97316"/>
</svg>
