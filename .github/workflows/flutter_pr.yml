name: Flutter PR Checks

on:
  pull_request:
    paths:
      - '**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'test/**'
      - 'integration_test/**'
      - '.github/workflows/**'

jobs:
  test:
    # Pin runner + Flutter to keep golden rendering stable over time.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Critical interaction tests
        run: bash tool/ci/run_critical_interactions.sh

      - name: Unit/Widget/Golden tests
        run: flutter test --exclude-tags=integration --exclude-tags=manual

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore
          retention-days: 14
