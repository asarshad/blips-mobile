name: Flutter Integration

on:
  push:
    branches:
      - main
  schedule:
    # 2:15 AM UTC daily
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  integration:
    # Pin runner + Flutter to keep golden rendering stable over time.
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      # Must come before flutter pub get so the macOS platform is fully
      # configured before dependency resolution on a fresh runner.
      - name: Enable macOS desktop target
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Pre-cache macOS SDK artifacts
        run: flutter precache --macos

      # sudo gem install fails on macos-14 runners (SIP-protected system Ruby).
      # Install via Homebrew to get the exact version used in Podfile.lock.
      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Cache CocoaPods specs
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-specs-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: cocoapods-specs-

      - name: Cache Pods directory
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install macOS pods
        if: steps.pods-cache.outputs.cache-hit != 'true'
        working-directory: macos
        run: pod install --repo-update

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit/Widget/Golden tests
        run: flutter test --exclude-tags=integration --exclude-tags=manual

      - name: Integration tests
        # Target only the smoke test explicitly — screenshot_test.dart is
        # intended for `flutter drive` with a screenshot driver and must not
        # be loaded here (flutter test on desktop launches one process per
        # file; screenshot_test fails to start without the drive setup).
        run: flutter test integration_test/app_smoke_test.dart -d macos
