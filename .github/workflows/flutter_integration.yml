name: Flutter Integration

on:
  push:
    branches:
      - main
  schedule:
    # 2:15 AM UTC daily
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  integration:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit/Widget/Golden tests
        run: flutter test --exclude-tags=integration --exclude-tags=manual

      - name: Integration tests
        run: flutter test integration_test --tags=integration
